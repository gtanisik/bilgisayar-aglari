<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Left Drawing Container: Client -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="260" height="170" rx="12" fill="url(#clientGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <!-- Client PC Drawing -->
    <g transform="translate(70, 20)">
      <rect x="5" y="5" width="65" height="48" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
      <rect x="11" y="11" width="53" height="36" fill="#e0f2fe"/>
      <path d="M 32 53 L 43 53 L 46 65 L 29 65 Z" fill="#64748b"/>
      <rect x="23" y="65" width="32" height="5" rx="1" fill="#475569"/>
      <rect x="78" y="16" width="24" height="52" rx="3" fill="#475569" stroke="#334155" stroke-width="1.5"/>
      <circle cx="90" cy="25" r="2.5" fill="#38bdf8"/>
      <line x1="84" y1="36" x2="96" y2="36" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
    <text x="130" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">İstemci</text>
    <text x="130" y="147" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">standart bir bilgisayarda çalışır</text>
  </g>

  <!-- Connection Line & Label -->
  <path d="M 290 115 L 360 115" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M 560 115 L 490 115" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="325" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-style="italic" fill="#2563eb" text-anchor="middle">bağlantı</text>
  <text x="525" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-style="italic" fill="#2563eb" text-anchor="middle">bağlantı</text>

  <!-- Internet Cloud shape -->
  <g transform="translate(360, 70)">
    <path d="M 20 50 A 25 25 0 0 1 50 25 A 35 35 0 0 1 100 25 A 25 25 0 0 1 110 50 A 20 20 0 0 1 100 75 L 20 75 A 20 20 0 0 1 20 50 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" fill="#0369a1" text-anchor="middle">İnternet</text>
  </g>

  <!-- Right Drawing Container: Server -->
  <g transform="translate(560, 30)">
    <rect x="0" y="0" width="260" height="170" rx="12" fill="url(#serverGrad)" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <!-- Server Rack Drawing -->
    <g transform="translate(100, 15)">
      <rect x="5" y="10" width="50" height="62" rx="4" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
      <rect x="9" y="16" width="42" height="11" rx="1.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <rect x="9" y="31" width="42" height="11" rx="1.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <rect x="9" y="46" width="42" height="11" rx="1.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <circle cx="44" cy="21.5" r="1.5" fill="#16a34a"/>
      <circle cx="44" cy="36.5" r="1.5" fill="#16a34a"/>
      <circle cx="44" cy="51.5" r="1.5" fill="#16a34a"/>
    </g>
    <text x="130" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Sunucu</text>
    <text x="130" y="147" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#15803d" text-anchor="middle">sunucu sınıfı bir bilgisayarda çalışır</text>
  </g>
</svg>
