<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="100%" height="100%">
  <defs>
    <style>
      .box-payload { fill: #f1f5f9; stroke: #0284c7; stroke-width: 2; }
      .box-header { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .text-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0369a1; text-anchor: start; }
      .text-payload { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0284c7; text-anchor: middle; }
      .line-pointer { stroke: #0284c7; stroke-width: 2; fill: none; }
      .head-num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0369a1; text-anchor: middle; }
    </style>
  </defs>

  <!-- Nested Header Boxes -->
  <!-- H1 (Physical) -->
  <rect x="40" y="140" width="40" height="45" class="box-header" />
  <text x="60" y="167" class="head-num">H1</text>
  
  <!-- H2 (Net Interface) -->
  <rect x="80" y="140" width="40" height="45" class="box-header" />
  <text x="100" y="167" class="head-num">H2</text>

  <!-- H3 (Internet) -->
  <rect x="120" y="140" width="40" height="45" class="box-header" />
  <text x="140" y="167" class="head-num">H3</text>

  <!-- H4 (Transport) -->
  <rect x="160" y="140" width="40" height="45" class="box-header" />
  <text x="180" y="167" class="head-num">H4</text>

  <!-- Application Payload Box -->
  <rect x="200" y="140" width="500" height="45" class="box-payload" />
  
  <!-- Left arrow line inside payload -->
  <line x1="210" y1="162.5" x2="280" y2="162.5" stroke="#0284c7" stroke-width="1.5" />
  <polygon points="210,162.5 220,157.5 220,167.5" fill="#0284c7" />

  <!-- Center Text (Clean & Unobstructed) -->
  <text x="450" y="168" class="text-payload">Uygulamanın Gönderdiği Mesaj (Payload)</text>

  <!-- Right arrow line inside payload -->
  <line x1="620" y1="162.5" x2="690" y2="162.5" stroke="#0284c7" stroke-width="1.5" />
  <polygon points="690,162.5 680,157.5 680,167.5" fill="#0284c7" />

  <!-- Pointer 1: Physical header -->
  <path d="M 270 25 L 60 25 L 60 132" class="line-pointer" />
  <polygon points="60,138 55,128 65,128" fill="#0284c7" />
  <text x="280" y="30" class="text-header">1: Fiziksel başlık (mümkün, fakat pek yaygın değil)</text>

  <!-- Pointer 2: Network Interface header -->
  <path d="M 270 55 L 100 55 L 100 132" class="line-pointer" />
  <polygon points="100,138 95,128 105,128" fill="#0284c7" />
  <text x="280" y="60" class="text-header">2: Ağ Arayüzü başlığı (Data Link Header)</text>

  <!-- Pointer 3: Internet header -->
  <path d="M 270 85 L 140 85 L 140 132" class="line-pointer" />
  <polygon points="140,138 135,128 145,128" fill="#0284c7" />
  <text x="280" y="90" class="text-header">3: İnternet başlığı (IP Header)</text>

  <!-- Pointer 4: Transport header -->
  <path d="M 270 115 L 180 115 L 180 132" class="line-pointer" />
  <polygon points="180,138 175,128 185,128" fill="#0284c7" />
  <text x="280" y="120" class="text-header">4: Taşıma başlığı (TCP / UDP Header)</text>
</svg>
