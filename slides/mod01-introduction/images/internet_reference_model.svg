<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 310" width="100%" height="280">
  <defs>
    <style>
      .box-front { fill: #f0f7ff; stroke: #007bff; stroke-width: 2; }
      .box-top { fill: #e2e8f0; stroke: #334155; stroke-width: 2; }
      .box-side { fill: #94a3b8; stroke: #334155; stroke-width: 2; }
      .layer-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #0066cc; text-anchor: middle; }
      .label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: bold; fill: #1e293b; text-anchor: start; }
      .arrow-line { stroke: #1e293b; stroke-width: 2; }
      .arrow-head { fill: #1e293b; }
    </style>
  </defs>

  <!-- Top 3D Face -->
  <polygon points="120,50 155,25 415,25 380,50" class="box-top" />

  <!-- Right 3D Side Face -->
  <polygon points="380,50 415,25 415,250 380,275" class="box-side" />
  
  <!-- Right 3D Side Dividers -->
  <line x1="380" y1="95" x2="415" y2="70" class="arrow-line" />
  <line x1="380" y1="140" x2="415" y2="115" class="arrow-line" />
  <line x1="380" y1="185" x2="415" y2="160" class="arrow-line" />
  <line x1="380" y1="230" x2="415" y2="205" class="arrow-line" />

  <!-- Front Face Boxes & Layer Titles -->
  <!-- Layer 5: Uygulama -->
  <rect x="120" y="50" width="260" height="45" class="box-front" />
  <text x="250" y="79" class="layer-text">Uygulama</text>

  <!-- Layer 4: Taşıma -->
  <rect x="120" y="95" width="260" height="45" class="box-front" />
  <text x="250" y="124" class="layer-text">Taşıma</text>

  <!-- Layer 3: İnternet -->
  <rect x="120" y="140" width="260" height="45" class="box-front" />
  <text x="250" y="169" class="layer-text">İnternet</text>

  <!-- Layer 2: Ağ Arayüzü -->
  <rect x="120" y="185" width="260" height="45" class="box-front" />
  <text x="250" y="214" class="layer-text">Ağ Arayüzü</text>

  <!-- Layer 1: Fiziksel -->
  <rect x="120" y="230" width="260" height="45" class="box-front" />
  <text x="250" y="259" class="layer-text">Fiziksel</text>

  <!-- Arrows and Labels on Right (Centered to each layer height) -->
  <!-- Layer 5 (Midpoint y=60) -->
  <line x1="480" y1="60" x2="405" y2="60" class="arrow-line" />
  <polygon points="397,60 407,55 407,65" class="arrow-head" />
  <text x="492" y="66" class="label-text">KATMAN 5</text>

  <!-- Layer 4 (Midpoint y=105) -->
  <line x1="480" y1="105" x2="405" y2="105" class="arrow-line" />
  <polygon points="397,105 407,100 407,110" class="arrow-head" />
  <text x="492" y="111" class="label-text">KATMAN 4</text>

  <!-- Layer 3 (Midpoint y=150) -->
  <line x1="480" y1="150" x2="405" y2="150" class="arrow-line" />
  <polygon points="397,150 407,145 407,155" class="arrow-head" />
  <text x="492" y="156" class="label-text">KATMAN 3</text>

  <!-- Layer 2 (Midpoint y=195) -->
  <line x1="480" y1="195" x2="405" y2="195" class="arrow-line" />
  <polygon points="397,195 407,190 407,200" class="arrow-head" />
  <text x="492" y="201" class="label-text">KATMAN 2</text>

  <!-- Layer 1 (Midpoint y=240) -->
  <line x1="480" y1="240" x2="405" y2="240" class="arrow-line" />
  <polygon points="397,240 407,235 407,245" class="arrow-head" />
  <text x="492" y="246" class="label-text">KATMAN 1</text>
</svg>
